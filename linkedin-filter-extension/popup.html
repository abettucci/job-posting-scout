<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scout Lens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">LOCAL JOB LENS</p>
      <h1>Scout Lens</h1>
      <p id="status">Cargando estado…</p>
      <dl>
        <div><dt>Detalles</dt><dd id="jobs">— / 12</dd></div>
        <div><dt>Empresas</dt><dd id="companies">— / 8</dd></div>
      </dl>
      <button id="pause">Pausar escaneo</button>
      <button id="clear" class="quiet">Limpiar caché local</button>
      <p class="hint">Abrí una búsqueda de LinkedIn Jobs para configurar filtros y ver resultados.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
